    <meta charset="UTF-8" />

    <meta name="description" content="Anup Tiwari is a Computer Science undergraduate at KIET Group of Institutions building full-stack web applications, real-time distributed platforms, and adaptive multi-agent AI systems." />

    <meta name="author" content="Anup Tiwari" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />

    <!-- Google Fonts: Inter, Manrope & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Instant Theme Initialization Script (Prevents FOUC / Theme Flash) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAFAF8] text-[#171717] dark:bg-[#0F0F0E] dark:text-[#F5F3EA] font-sans antialiased selection:bg-[#C49A2C]/25 dark:selection:bg-[#D4AF37]/30 min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
